<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подання заявки на конкурс</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --error: #ef4444;
      --success: #16a34a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    
    input, select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* Кастомное выпадающее меню с поиском по любым словам */
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: none;
      margin-top: 4px;
    }

    .autocomplete-item {
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.35;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover, .autocomplete-item.active {
      background-color: #eff6ff;
      color: var(--primary);
    }

    .autocomplete-item mark {
      background: #fef08a;
      color: inherit;
      padding: 0 2px;
      border-radius: 2px;
    }
    
    .status-msg {
      font-size: 0.8rem;
      margin-top: 0.4rem;
      min-height: 1.2rem;
    }

    .status-msg.error { color: var(--error); }
    .status-msg.success { color: var(--success); }

    button {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h1>Подання заявки на конкурс</h1>
  <form id="contestForm" autocomplete="off">
    <div class="form-group">
      <label for="fullName">ПІБ учасника</label>
      <input type="text" id="fullName" name="fullName" placeholder="Шевченко Тарас Григорович" required>
    </div>

    <div class="form-group">
      <label for="birthDate">Дата народження</label>
      <input type="date" id="birthDate" name="birthDate" required>
    </div>

    <!-- Поле 1: Основное заведение -->
    <div class="form-group">
      <label for="mainSchool">Основний заклад освіти (школа, ліцей, ПТНЗ, ІРЦ)</label>
      <div class="hint">Введіть будь-яке слово з назви або місто</div>
      <input 
        type="text" 
        id="mainSchool" 
        name="mainSchool" 
        placeholder="Завантаження списку закладів..." 
        required
      >
      <div class="autocomplete-dropdown" id="mainDropdown"></div>
    </div>

    <!-- Поле 2: Внешкольное заведение (ЗПО) -->
    <div class="form-group">
      <label for="zpoSchool">Заклад позашкільної освіти (ЗПО)</label>
      <div class="hint">Введіть будь-яке слово з назви (наприклад: учнів, творчості, доцнттум)</div>
      <input 
        type="text" 
        id="zpoSchool" 
        name="zpoSchool" 
        placeholder="Оберіть зі списку або залиште порожнім..."
      >
      <div class="autocomplete-dropdown" id="zpoDropdown"></div>
    </div>

    <div class="form-group">
      <label for="category">Номінація</label>
      <select id="category" name="category" required>
        <option value="" disabled selected>Оберіть номінацію...</option>
        <option value="Номінація 1">Номінація 1</option>
        <option value="Номінація 2">Номінація 2</option>
        <option value="Номінація 3">Номінація 3</option>
      </select>
    </div>

    <div class="form-group">
      <label for="workTitle">Назва роботи</label>
      <input type="text" id="workTitle" name="workTitle" placeholder="Введіть назву проекту" required>
    </div>

    <div class="form-group">
      <label for="driveUrl">Посилання на роботу (Google Диск)</label>
      <input type="url" id="driveUrl" name="driveUrl" placeholder="https://drive.google.com/..." required>
      <span class="status-msg" id="driveStatus"></span>
    </div>

    <button type="submit" id="submitBtn">Надіслати заявку</button>
  </form>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_k7W0ad2WjI1zolOdwYR943rrCZEfYpXQrVLefVodWfSwZXrTVf2X1lANVGLcvnUJ/exec';

  let mainData = [];
  let zpoData = [];

  const mainInput = document.getElementById('mainSchool');
  const mainDropdown = document.getElementById('mainDropdown');

  const zpoInput = document.getElementById('zpoSchool');
  const zpoDropdown = document.getElementById('zpoDropdown');

  // Универсальный умный поиск по любым подстрокам и словам
  function setupAutocomplete(input, dropdown, getItems) {
    function filterAndRender() {
      const query = input.value.trim().toLowerCase();
      dropdown.innerHTML = '';

      if (!query) {
        dropdown.style.display = 'none';
        return;
      }

      // Разбиваем введенный текст на отдельные слова для поиска
      const queryWords = query.split(/\s+/).filter(Boolean);
      const items = getItems();

      // Находим все записи, содержащие ВСЕ введенные слова в любой части названия
      const matches = items.filter(item => {
        const itemLower = item.toLowerCase();
        return queryWords.every(word => itemLower.includes(word));
      }).slice(0, 35); // выводим до 35 совпадений

      if (matches.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';

        // Подсвечиваем найденные слова
        let highlighted = item;
        queryWords.forEach(word => {
          const regex = new RegExp(`(${word})`, 'gi');
          highlighted = highlighted.replace(regex, '<mark>$1</mark>');
        });

        div.innerHTML = highlighted;
        div.addEventListener('mousedown', (e) => {
          e.preventDefault();
          input.value = item;
          dropdown.style.display = 'none';
        });
        dropdown.appendChild(div);
      });

      dropdown.style.display = 'block';
    }

    input.addEventListener('input', filterAndRender);
    input.addEventListener('focus', filterAndRender);
    input.addEventListener('blur', () => {
      // Прячем меню при потере фокуса
      setTimeout(() => { dropdown.style.display = 'none'; }, 200);
    });
  }

  // Загрузка списков заведений
  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      mainData = data.main || [];
      zpoData = data.zpo || [];

      setupAutocomplete(mainInput, mainDropdown, () => mainData);
      setupAutocomplete(zpoInput, zpoDropdown, () => zpoData);

      mainInput.placeholder = "Почніть вводити назву закладу...";
      zpoInput.placeholder = "Почніть вводити назву закладу...";
    } catch (e) {
      console.warn('Не вдалося завантажити довідник закладів:', e);
      mainInput.placeholder = "Введіть назву закладу...";
      zpoInput.placeholder = "Введіть назву закладу...";
    }
  });

  // Валидация Google Drive
  const driveInput = document.getElementById('driveUrl');
  const driveStatus = document.getElementById('driveStatus');
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('contestForm');

  function extractDriveId(url) {
    const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (fileMatch) return { id: fileMatch[1], type: 'file' };

    const folderMatch = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    if (folderMatch) return { id: folderMatch[1], type: 'folder' };

    const openMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (openMatch) return { id: openMatch[1], type: 'file' };

    return null;
  }

  driveInput.addEventListener('blur', () => {
    const url = driveInput.value.trim();
    driveStatus.className = 'status-msg';
    driveStatus.textContent = '';

    if (!url) return;

    const parsed = extractDriveId(url);

    if (!parsed) {
      driveStatus.className = 'status-msg error';
      driveStatus.textContent = 'Некоректне посилання на Google Диск';
      return;
    }

    if (parsed.type === 'file') {
      driveStatus.textContent = 'Перевіряємо доступність файлу...';
      
      const checkImg = new Image();
      checkImg.src = `https://drive.google.com/thumbnail?id=${parsed.id}&sz=w100`;

      checkImg.onload = () => {
        driveStatus.className = 'status-msg success';
        driveStatus.textContent = 'Файл знайдено, доступ відкритий';
      };

      checkImg.onerror = () => {
        driveStatus.className = 'status-msg error';
        driveStatus.textContent = 'Файл недоступний. Відкрийте «Загальний доступ для всіх за посиланням»';
      };
    } else {
      driveStatus.className = 'status-msg success';
      driveStatus.textContent = 'Формат посилання вірний (переконайтеся, що доступ відкритий)';
    }
  });

  // Отправка формы
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (driveStatus.classList.contains('error')) {
      alert('Будь ласка, відкрийте доступ до файлу на Google Диску перед надсиланням.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Надсилання...';

    const formData = new FormData(form);
    const payload = Object.fromEntries(formData.entries());

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      alert('Заявку успішно надіслано!');
      form.reset();
      driveStatus.textContent = '';
      driveStatus.className = 'status-msg';
    } catch (err) {
      alert('Сталася помилка при надсиланні заявки. Спробуйте ще раз.');
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Надіслати заявку';
    }
  });
</script>

</body>
</html>
