<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабінет судді — Оцінювання фото</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Шапка */
    header { height: 68px; background: var(--panel); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; z-index: 40; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .nav-btn { background: #334155; color: #fff; border: 1px solid var(--panel-border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .nav-btn:hover { background: #475569; }

    /* Панель навигатора в шапке */
    .catalog-toggle-btn { background: #1e293b; border: 1px solid var(--accent); color: var(--accent); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .catalog-toggle-btn:hover { background: var(--accent); color: #fff; }
    
    .quick-jump-wrap { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--panel-border); }
    .quick-jump-input { width: 55px; background: transparent; border: none; color: #fff; text-align: center; font-weight: bold; font-size: 14px; outline: none; }
    .quick-jump-label { color: var(--text-muted); font-size: 13px; }

    .progress-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .progress-bar-wrap { width: 120px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s ease; }

    .workspace { display: flex; flex: 1; height: calc(100vh - 68px); position: relative; }
    
    /* Левая зона: Фото */
    .media-stage { flex: 7; display: flex; flex-direction: column; background: #020617; position: relative; }
    .work-tabs { display: flex; gap: 8px; padding: 12px 16px; background: rgba(15, 23, 42, 0.9); z-index: 10; border-bottom: 1px solid var(--panel-border); }
    .tab-btn { background: #1e293b; border: 1px solid var(--panel-border); color: #cbd5e1; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .tab-btn.evaluated { border-color: rgba(16, 185, 129, 0.5); }
    .tab-badge { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.25); }

    .image-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; position: relative; }
    .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: zoom-in; }
    .open-link-btn { font-size: 13px; color: var(--accent); text-decoration: none; }
    .open-link-btn:hover { text-decoration: underline; }

    /* Правая зона: Оценивание */
    .scoring-panel { flex: 3; min-width: 380px; max-width: 440px; background: var(--panel); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; justify-content: space-between; padding: 24px; overflow-y: auto; }
    
    .criteria-group { margin-bottom: 18px; }
    .criteria-title { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; }
    .max-badge { color: var(--text-muted); font-size: 12px; }
    
    .pill-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pill-btn { height: 38px; background: #334155; border: 1px solid transparent; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .pill-btn:hover { background: #475569; }
    .pill-btn.active { background: var(--accent); border-color: #60a5fa; color: white; }

    .total-card { background: #0f172a; padding: 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border: 1px solid var(--panel-border); }
    .total-score { font-size: 28px; font-weight: 700; color: var(--success); }

    .submit-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all 0.25s ease; }
    .submit-btn:hover { background: var(--accent-hover); }
    .submit-btn.saving { background: #d97706; cursor: wait; }
    .submit-btn.saved { background: var(--success); transform: scale(1.01); }
    
    /* Выдвижная боковая панель (Шторка каталога на 500+ работ) */
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
    .drawer { position: fixed; top: 0; left: -420px; width: 400px; height: 100vh; background: #1e293b; border-right: 1px solid var(--panel-border); z-index: 110; transition: left 0.3s ease; display: flex; flex-direction: column; }
    .drawer.open { left: 0; }
    
    .drawer-header { padding: 18px 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
    .drawer-filters { padding: 12px 20px; border-bottom: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    .search-input { width: 100%; padding: 8px 12px; background: #1e293b; border: 1px solid var(--panel-border); border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
    .filter-pills { display: flex; gap: 6px; }
    .filter-btn { flex: 1; padding: 6px; background: #1e293b; border: 1px solid var(--panel-border); color: var(--text-muted); font-size: 12px; border-radius: 6px; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .drawer-list { flex: 1; overflow-y: auto; padding: 10px; }
    .drawer-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; background: #151f30; transition: background 0.15s; }
    .drawer-item:hover { background: #334155; }
    .drawer-item.active { border-color: var(--accent); background: #1e293b; }
    .drawer-item.completed { border-left: 4px solid var(--success); }

    #fsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
    #fsModal img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="catalog-toggle-btn" onclick="toggleDrawer(true)">
        ☰ Каталог робіт
      </button>
      <span style="font-weight: 700; font-size: 16px;" id="participantTitle">Завантаження...</span>
      <a id="externalLink" href="#" target="_blank" class="open-link-btn" style="display:none;">Оригінал на Drive ↗</a>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="nav-btn" onclick="prevParticipant()">←</button>

      <!-- Прямой ввод номера участника -->
      <div class="quick-jump-wrap" title="Введіть номер і натисніть Enter">
        <span class="quick-jump-label">№</span>
        <input type="number" id="jumpInput" class="quick-jump-input" min="1" value="1" onkeydown="handleJumpKey(event)">
        <span class="quick-jump-label" id="totalCountLabel">/ 0</span>
      </div>

      <button class="nav-btn" onclick="nextParticipant()">→</button>

      <!-- Прогресс -->
      <div class="progress-box">
        <span id="progressText" style="font-size: 11px; color: var(--text-muted);">0 / 0</span>
        <div class="progress-bar-wrap">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="workspace">
    <div class="media-stage">
      <div class="work-tabs" id="workTabs"></div>
      <div class="image-container">
        <img id="mainImage" src="" alt="Фотографія" onclick="openFullscreen(this.src)" onerror="handleImageError(this)" />
      </div>
    </div>

    <div class="scoring-panel">
      <div>
        <div class="criteria-group">
          <div class="criteria-title">
            <span>Точність</span>
            <span class="max-badge">макс: 10</span>
          </div>
          <div class="pill-group" id="groupAccuracy"></div>
        </div>

        <div class="criteria-group">
          <div class="criteria-title">
            <span>Креативність</span>
            <span class="max-badge">макс: 5</span>
          </div>
          <div class="pill-group" id="groupCreativity"></div>
        </div>

        <div class="criteria-group">
          <div class="criteria-title">
            <span>Художність</span>
            <span class="max-badge">макс: 5</span>
          </div>
          <div class="pill-group" id="groupArtistry"></div>
        </div>

        <div class="criteria-group">
          <div class="criteria-title">
            <span>Технічність</span>
            <span class="max-badge">макс: 5</span>
          </div>
          <div class="pill-group" id="groupTechnique"></div>
        </div>

        <div class="total-card">
          <span>Сума балів:</span>
          <span class="total-score" id="totalScore">0 / 25</span>
        </div>
      </div>

      <button id="saveBtn" class="submit-btn" onclick="submitCurrentEvaluation()">
        <span id="saveBtnText">Зберегти оцінку</span>
      </button>
    </div>
  </div>

  <!-- Шторка каталога -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer(false)"></div>
  <div id="catalogDrawer" class="drawer">
    <div class="drawer-header">
      <h3>Каталог робіт</h3>
      <button class="nav-btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    <div class="drawer-filters">
      <input type="text" id="searchInput" class="search-input" placeholder="Пошук за назвою чи номером..." oninput="renderCatalogList()">
      <div class="filter-pills">
        <button class="filter-btn active" id="fAll" onclick="setFilter('all')">Усі</button>
        <button class="filter-btn" id="fPending" onclick="setFilter('pending')">Неоцінені</button>
        <button class="filter-btn" id="fDone" onclick="setFilter('done')">Оцінені</button>
      </div>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </div>

  <div id="fsModal" onclick="closeFullscreen()">
    <img id="fsImage" src="" />
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwyoTLX19eqGT7cMGCLi_4tpooTMaghpsZzkleL3OLSGx2gFJQjnNEKGonUQMJ0Hxrx/exec';

    let participants = [];
    let pIndex = 0;
    let wIndex = 0;
    let currentScores = { accuracy: null, creativity: null, artistry: null, technique: null };
    let currentFilter = 'all';

    window.onload = async () => {
      buildButtons('groupAccuracy', 10, 'accuracy');
      buildButtons('groupCreativity', 5, 'creativity');
      buildButtons('groupArtistry', 5, 'artistry');
      buildButtons('groupTechnique', 5, 'technique');

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (!data || data.length === 0 || data.error) {
          document.getElementById('participantTitle').textContent = data.error || 'У таблиці немає доступних робіт';
          return;
        }

        participants = data;
        document.getElementById('totalCountLabel').textContent = `/ ${participants.length}`;
        pIndex = 0;
        wIndex = 0;
        renderView();
        updateProgress();
      } catch (err) {
        alert('Помилка підключення: ' + err.message);
        document.getElementById('participantTitle').textContent = 'Помилка завантаження';
      }
    };

    function buildButtons(containerId, count, key) {
      const el = document.getElementById(containerId);
      for (let i = 1; i <= count; i++) {
        const btn = document.createElement('button');
        btn.className = 'pill-btn';
        btn.textContent = i;
        btn.onclick = () => {
          currentScores[key] = i;
          el.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateTotal();
        };
        el.appendChild(btn);
      }
    }

    function isWorkDone(work) {
      return work.scores.accuracy && work.scores.creativity && work.scores.artistry && work.scores.technique;
    }

    function isParticipantDone(p) {
      return p.works.length > 0 && p.works.every(isWorkDone);
    }

    function updateTotal() {
      const sum = (Number(currentScores.accuracy) || 0) + 
                  (Number(currentScores.creativity) || 0) + 
                  (Number(currentScores.artistry) || 0) + 
                  (Number(currentScores.technique) || 0);
      document.getElementById('totalScore').textContent = `${sum} / 25`;
    }

    function updateProgress() {
      let totalWorks = 0;
      let evaluatedWorks = 0;

      participants.forEach(p => {
        p.works.forEach(w => {
          totalWorks++;
          if (isWorkDone(w)) evaluatedWorks++;
        });
      });

      const percent = totalWorks > 0 ? Math.round((evaluatedWorks / totalWorks) * 100) : 0;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressText').textContent = `${evaluatedWorks} / ${totalWorks} (${percent}%)`;
    }

    function renderView() {
      if (!participants.length) return;
      const p = participants[pIndex];
      document.getElementById('participantTitle').textContent = p.title;
      document.getElementById('jumpInput').value = pIndex + 1;

      // Табы доступных фото
      const tabsEl = document.getElementById('workTabs');
      tabsEl.innerHTML = '';
      p.works.forEach((w, idx) => {
        const btn = document.createElement('button');
        const done = isWorkDone(w);
        btn.className = `tab-btn ${idx === wIndex ? 'active' : ''} ${done ? 'evaluated' : ''}`;
        btn.innerHTML = `<span>Фото #${w.workIndex}</span> ${done ? '<span class="tab-badge">✓</span>' : ''}`;
        btn.onclick = () => { wIndex = idx; renderView(); };
        tabsEl.appendChild(btn);
      });

      const work = p.works[wIndex];
      const img = document.getElementById('mainImage');
      img.dataset.retried = "false";
      img.src = work.previewUrl;

      const extLink = document.getElementById('externalLink');
      extLink.href = work.link;
      extLink.style.display = 'inline';

      currentScores = { ...work.scores };
      setButtonActive('groupAccuracy', currentScores.accuracy);
      setButtonActive('groupCreativity', currentScores.creativity);
      setButtonActive('groupArtistry', currentScores.artistry);
      setButtonActive('groupTechnique', currentScores.technique);
      updateTotal();
    }

    function handleJumpKey(e) {
      if (e.key === 'Enter') {
        const val = parseInt(document.getElementById('jumpInput').value);
        if (val >= 1 && val <= participants.length) {
          pIndex = val - 1;
          wIndex = 0;
          renderView();
        } else {
          alert(`Вкажіть число від 1 до ${participants.length}`);
        }
      }
    }

    /* Логика Каталога / Шторки */
    function toggleDrawer(open) {
      const drawer = document.getElementById('catalogDrawer');
      const overlay = document.getElementById('drawerOverlay');
      if (open) {
        renderCatalogList();
        drawer.classList.add('open');
        overlay.style.display = 'block';
      } else {
        drawer.classList.remove('open');
        overlay.style.display = 'none';
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (filter === 'all') document.getElementById('fAll').classList.add('active');
      if (filter === 'pending') document.getElementById('fPending').classList.add('active');
      if (filter === 'done') document.getElementById('fDone').classList.add('active');
      renderCatalogList();
    }

    function renderCatalogList() {
      const list = document.getElementById('drawerList');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      list.innerHTML = '';

      participants.forEach((p, idx) => {
        const isDone = isParticipantDone(p);
        const evalCount = p.works.filter(isWorkDone).length;
        const totalCount = p.works.length;

        // Фильтрация по статусу
        if (currentFilter === 'done' && !isDone) return;
        if (currentFilter === 'pending' && isDone) return;

        // Фильтрация по поиску (по номеру или названию)
        const matchNum = String(idx + 1).includes(query);
        const matchTitle = p.title.toLowerCase().includes(query);
        if (query && !matchNum && !matchTitle) return;

        const item = document.createElement('div');
        item.className = `drawer-item ${idx === pIndex ? 'active' : ''} ${isDone ? 'completed' : ''}`;
        item.innerHTML = `
          <div>
            <div style="font-weight:600; font-size:14px;">${idx + 1}. ${p.title}</div>
            <div style="font-size:12px; color:var(--text-muted);">${evalCount} з ${totalCount} фото оцінено</div>
          </div>
          <div style="font-weight:bold; color:${isDone ? 'var(--success)' : 'var(--text-muted)'};">
            ${isDone ? '✓' : '○'}
          </div>
        `;
        item.onclick = () => {
          pIndex = idx;
          wIndex = 0;
          renderView();
          toggleDrawer(false);
        };
        list.appendChild(item);
      });
    }

    function handleImageError(imgEl) {
      const work = participants[pIndex].works[wIndex];
      if (work.driveId && imgEl.dataset.retried !== "true") {
        imgEl.dataset.retried = "true";
        imgEl.src = `https://lh3.googleusercontent.com/d/${work.driveId}=s1600`;
      }
    }

    function setButtonActive(containerId, val) {
      const container = document.getElementById(containerId);
      container.querySelectorAll('.pill-btn').forEach(b => {
        b.classList.toggle('active', Number(b.textContent) === Number(val));
      });
    }

    async function submitCurrentEvaluation() {
      if (!currentScores.accuracy || !currentScores.creativity || !currentScores.artistry || !currentScores.technique) {
        alert('Будь ласка, вкажіть усі 4 критерії оцінювання');
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      const saveBtnText = document.getElementById('saveBtnText');
      saveBtn.classList.add('saving');
      saveBtnText.textContent = 'Збереження...';

      const p = participants[pIndex];
      const w = p.works[wIndex];

      const payload = {
        rowNumber: p.rowNumber,
        photoColIndex: w.startCol,
        accuracy: currentScores.accuracy,
        creativity: currentScores.creativity,
        artistry: currentScores.artistry,
        technique: currentScores.technique
      };

      w.scores = { ...currentScores };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Помилка запису:', e);
      }

      saveBtn.classList.remove('saving');
      saveBtn.classList.add('saved');
      saveBtnText.textContent = '✓ Збережено!';
      updateProgress();

      setTimeout(() => {
        saveBtn.classList.remove('saved');
        saveBtnText.textContent = 'Зберегти оцінку';

        if (wIndex < p.works.length - 1) {
          wIndex++;
          renderView();
        } else if (pIndex < participants.length - 1) {
          pIndex++;
          wIndex = 0;
          renderView();
        } else {
          alert('Усі фотографії оцінено!');
        }
      }, 500);
    }

    function nextParticipant() {
      if (pIndex < participants.length - 1) { pIndex++; wIndex = 0; renderView(); }
    }
    function prevParticipant() {
      if (pIndex > 0) { pIndex--; wIndex = 0; renderView(); }
    }

    function openFullscreen(src) {
      document.getElementById('fsImage').src = src;
      document.getElementById('fsModal').style.display = 'flex';
    }
    function closeFullscreen() {
      document.getElementById('fsModal').style.display = 'none';
    }
  </script>
</body>
</html>
